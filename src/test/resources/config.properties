# ---------------------------------------------------------------------------
# Test configuration. Every key can be overridden from the command line:
#   mvn test -Ddevice.name=Pixel_7 -Dappium.server.url=http://127.0.0.1:4723
# ---------------------------------------------------------------------------

# --- Appium server ---
# Leave empty to let the framework start (and stop) a local Appium server automatically.
# Set to e.g. http://127.0.0.1:4723 to use a server you started yourself (`appium`).
appium.server.url=

# --- Device ---
platform.name=Android
automation.name=UiAutomator2
# Any value works for a single connected emulator/device; set device.udid to target one of several.
device.name=Android Emulator
device.udid=

# --- Application under test ---
# If the APK exists it is (re)installed at session start; otherwise the already-installed app is used.
app.path=apps/mda-2.3.0-27.apk
app.package=com.saucelabs.mydemoapp.android
app.activity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity

# --- Timeouts (seconds) ---
timeout.explicit=15
timeout.new.command=120
timeout.server.startup=60

# --- Android 15+/16 KB page-size "App Compatibility" system dialog ---
# true  -> tap "Don't Show Again" so it no longer appears for this app on the device (recommended for test devices)
# false -> tap "OK" (the dialog may appear again on the next app start)
compat.dialog.suppress=true

# --- Reporting ---
report.dir=test-output/reports
report.title=My Demo App - Android Test Report
